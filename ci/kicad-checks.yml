name: KiCad ERC + DRC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  erc-drc:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        project:
          - { dir: motherboard, name: motherboard }
          - { dir: power,        name: power }
          - { dir: audio,        name: audio }
          - { dir: keyboard,     name: keyboard }
          - { dir: haptic,       name: haptic }
          - { dir: switch,       name: switch }

    steps:
      - uses: actions/checkout@v4

      - name: ERC
        run: |
          kicad-cli sch erc \
            --severity-error all \
            --exit-code-violations \
            --output ${{ matrix.project.dir }}/erc-report.txt \
            ${{ matrix.project.dir }}/${{ matrix.project.name }}.kicad_sch || true
          cat ${{ matrix.project.dir }}/erc-report.txt

      - name: DRC
        run: |
          kicad-cli pcb drc \
            --severity-error all \
            --schematic-parity \
            --exit-code-violations \
            --output ${{ matrix.project.dir }}/drc-report.txt \
            ${{ matrix.project.dir }}/${{ matrix.project.name }}.kicad_pcb || true
          cat ${{ matrix.project.dir }}/drc-report.txt

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-reports
          path: ${{ matrix.project.dir }}/*-report.txt

  gerbers-on-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: erc-drc
    container:
      image: kicad/kicad:8.0
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Generate gerbers
        run: |
          for project in motherboard power audio keyboard haptic switch; do
            mkdir -p gerbers/$project
            kicad-cli pcb export gerbers \
              --output gerbers/$project \
              $project/$project.kicad_pcb
            kicad-cli pcb export drill \
              --output gerbers/$project \
              $project/$project.kicad_pcb
          done

      - name: Bundle
        run: |
          cd gerbers
          for d in */; do
            zip -r "${d%/}.zip" "$d"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gerbers-${{ github.ref_name }}
          path: gerbers/*.zip
